name: GrapherNG
options:
  bundleIdPrefix: tech.xvanturing
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 界面文字的 key 用英文原文（`L("…")`），缺翻译时退回英文；中文在 zh-Hans.lproj。
  developmentLanguage: en

packages:
  # Sparkle 2 自动更新（同 FreeMind / Perch / UniReader），是本工程唯一的第三方包，只链接到 App target。
  # `UpdaterService.swift` 用 SPUStandardUpdaterController 跑整个流程（拉 appcast、EdDSA 校验、下载、安装、重启）；
  # `scripts/release.sh` 用这个包里的 sign_update 给发布的 zip 签名。App 没有开沙盒，不需要 Installer XPC。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.1"

settings:
  base:
    # 版本号只在这里改，各 target 的 Info.plist 都引用这两个值。
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: T8F5T6HKG8
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # 本地开发用 ad-hoc 签名即可运行；发布时再走 Developer ID。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  # ── 数学与采样层 ────────────────────────────────────────────────
  # 框架形式而不是全部合进 App，是为了让编译器守住这条边界：这一层不允许 import
  # AppKit。整套单元测试都跑在它上面，从来不碰界面代码。
  GrapherKit:
    type: framework
    platform: macOS
    sources:
      - Sources/GrapherKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.GrapherNG.GrapherKit
        PRODUCT_NAME: GrapherKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Quick Look 扩展也链接这一层，只许用扩展里能用的 API。
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        # Debug 默认是 -Onone，对这一层是 27 倍的代价（实测网格求值 1.2M vs 32M
        # 点/秒）：停手后重算要等 4 秒、拖动只有 5 帧，开发时没法用。
        # 只给这一层开优化，GrapherApp 仍是 -Onone，界面代码照样能单步。
        # 这一层有 76 项单元测试兜底，本来也很少需要单步进去。
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

  # ── Metal 渲染层 ───────────────────────────────────────────────
  # 只依赖 GrapherKit 与系统框架。着色器是运行期从内嵌字符串编译的，所以没有
  # .metal 编译阶段，这里不需要额外的 build phase。
  GrapherRender:
    type: framework
    platform: macOS
    sources:
      - Sources/GrapherRender
    dependencies:
      - target: GrapherKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.GrapherNG.GrapherRender
        PRODUCT_NAME: GrapherRender
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # ── App ───────────────────────────────────────────────────────
  GrapherNG:
    type: application
    platform: macOS
    sources:
      - path: Sources/GrapherApp
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - target: GrapherKit
        embed: true
      - target: GrapherRender
        embed: true
      - target: GrapherNGQuickLook
        embed: true
      - target: GrapherNGThumbnail
        embed: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: GrapherNG
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.GrapherNG
        INFOPLIST_FILE: Sources/GrapherApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        # 同 FreeMind：Debug 把 .grapher 登记为 Alternate、Release 为 Owner。装了正式版时双击 .grapher
        # 总是用正式版打开，开发编出来的 Debug 版不会抢走；没装正式版时 Debug 版照样能打开。
        Debug:
          GRAPHER_HANDLER_RANK: Alternate
        Release:
          GRAPHER_HANDLER_RANK: Owner
    info:
      path: Sources/GrapherApp/Resources/Info.plist
      properties:
        CFBundleName: GrapherNG
        CFBundleDisplayName: Grapher NG
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 xVanTuring"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        # ── Sparkle 自动更新（见 docs/release.md）─────────────────────
        # appcast 放在仓库 main 分支根目录，scripts/release.sh 每次发布后提交并推送，所以仓库必须保持公开。
        SUFeedURL: "https://raw.githubusercontent.com/xVanTuring/grapher-ng/main/appcast.xml"
        # EdDSA 公钥，用来校验下载的更新包；私钥在发布机的登录钥匙串里（与 FreeMind / Perch / UniReader 共用一对）。
        # ⚠️ 第一次发布之后严禁更换，否则已安装的版本会拒绝以后所有的更新。
        SUPublicEDKey: "g3SCjADYsXhMN5/4hnQZ7eOawvtVoGJJsS5CFew15WQ="
        # 默认每天自动检查一次（不在第二次启动时弹窗询问）。
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # NSDocument 文档模型：新建 / 打开 / 保存 / 关窗与退出时的保存提示都靠这里登记。
        # 本 App 的文档是 .grapher（内容是 JSON），双击就用本 App 打开。
        # 早先存的 .json 仍能打开，但只读（Viewer）：⌘S 会弹存储面板另存成 .grapher；
        # 对 .json 只是 `Alternate`，在「打开方式」里列出本 App，不抢 .json 的默认打开程序。
        CFBundleDocumentTypes:
          - CFBundleTypeName: Grapher NG Graph
            CFBundleTypeRole: Editor
            LSHandlerRank: "$(GRAPHER_HANDLER_RANK)"
            LSItemContentTypes: [tech.xvanturing.grapherng.graph]
            NSDocumentClass: "$(PRODUCT_MODULE_NAME).GraphDocument"
          - CFBundleTypeName: JSON Graph
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
            NSDocumentClass: "$(PRODUCT_MODULE_NAME).GraphDocument"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tech.xvanturing.grapherng.graph
            UTTypeDescription: Grapher NG Graph
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [grapher]

  # ── Quick Look：访达空格预览 / 文件缩略图（同 FreeMind）────────────
  # 两个扩展都只链接 GrapherKit 与 GrapherRender（不再嵌一份，用 App 里的），画法是 `GraphSnapshot`，
  # 直接读 .grapher，不依赖 NSDocument。扩展必须开沙盒。
  GrapherNGQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/QuickLook
        excludes:
          - "Info.plist"
      # 与 App 共用的两个界面文件：刻度文字图层池、把 NSEvent 换成 CanvasInput 的参数。
      - path: Sources/GrapherApp/Views/TextLayerPool.swift
      - path: Sources/GrapherApp/Views/CanvasInput+AppKit.swift
    dependencies:
      - target: GrapherKit
        embed: false
      - target: GrapherRender
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.GrapherNG.QuickLook
        CODE_SIGN_ENTITLEMENTS: Extensions/Shared/Extension.entitlements
        INFOPLIST_FILE: Extensions/QuickLook/Info.plist
        SKIP_INSTALL: YES
        # 框架在 App 的 Contents/Frameworks 里：扩展在 Contents/PlugIns/X.appex/Contents/MacOS 下。
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    info:
      path: Extensions/QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Grapher NG Quick Look
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          # 视图型预览：扩展自己出一块只读画布，预览窗口会把拖动、滚动、捏合交给它（实测）。
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [tech.xvanturing.grapherng.graph]

  GrapherNGThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/Thumbnail
        excludes:
          - "Info.plist"
    dependencies:
      - target: GrapherKit
        embed: false
      - target: GrapherRender
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.GrapherNG.Thumbnail
        CODE_SIGN_ENTITLEMENTS: Extensions/Shared/Extension.entitlements
        INFOPLIST_FILE: Extensions/Thumbnail/Info.plist
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    info:
      path: Extensions/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: Grapher NG Thumbnail
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes: [tech.xvanturing.grapherng.graph]

  # ── 测试 ──────────────────────────────────────────────────────
  # 以 App 为宿主运行（同 FreeMind / Perch）：App 检测到自己在测试宿主里就不开窗口，
  # 所以测试期间不会弹窗打断正在用的实例。
  GrapherNGTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GrapherNGTests
    dependencies:
      - target: GrapherNG
      - target: GrapherKit
      - target: GrapherRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.GrapherNGTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GrapherNG.app/Contents/MacOS/GrapherNG
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  GrapherNG:
    build:
      targets:
        GrapherNG: all
        GrapherNGTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # 公式错误提示等测试按中文原文断言，测试固定用简体中文跑，不随本机系统语言变。
      language: zh-Hans
      targets:
        - GrapherNGTests
